---
name: CI - Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'docker/**'
      - '.github/workflows/**'

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            desktop:
              - 'desktop/**'
            mobile:
              - 'mobile/**'
            # Deliberately excludes mobile/ -- the Flutter app is not part of
            # the monolith image, so a mobile-only change must not rebuild it.
            docker:
              - 'api/**'
              - 'desktop/**'
              - 'docker/**'

  test-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install app dependencies
        run: sh set-up-dependencies.sh
        working-directory: ./api
      - name: Build
        run: go build -v ./...
        working-directory: ./api
      - name: Test
        run: go test -coverprofile=coverage.out -covermode=atomic -v ./...
        working-directory: ./api
      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./api/coverage.out
          flags: api
          fail_ci_if_error: true
          verbose: true
      - name: Test imap client
        run: |
          . wranglervenv/bin/activate
          python3 -m unittest discover -s ./imap-client
        working-directory: ./api

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      GH_PACKAGE_READ_TOKEN_DESKTOP: ${{ secrets.GH_PACKAGE_READ_TOKEN_DESKTOP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
      - name: Install dependencies
        run: npm ci --verbose
        working-directory: ./desktop
      - name: Run tests
        run: npm run test:ci
        working-directory: ./desktop
      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: desktop/coverage/receipt-wrangler-desktop/cobertura-coverage.xml
          format: markdown
          output: both
          badge: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./desktop/coverage/receipt-wrangler-desktop/cobertura-coverage.xml
          flags: desktop
          fail_ci_if_error: true

  # Flutter unit/widget tests. Fast and hermetic -- no emulator, no backend --
  # so unlike the advisory mobile-e2e workflow this one is gating.
  #
  # `flutter analyze` is deliberately NOT run here: it currently exits 1 on 107
  # pre-existing issues (0 errors), 73 of which are inside the generated client
  # under mobile/api/, which the repo forbids hand-editing. Gating on it would
  # fail the build for reasons unrelated to the change under test. Enabling it
  # means first excluding api/** in mobile/analysis_options.yaml (empty today)
  # and clearing the remainder in lib/ + test/.
  test-mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # Least-privilege GITHUB_TOKEN: this job only reads the repo source. Mirrors
    # the same hardening applied to mobile-e2e.yml for the CodeQL
    # actions-missing-workflow-permissions alert.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for later steps to pick up
          # (zizmor "artipacked"); nothing here pushes.
          persist-credentials: false
      # Pinned to the same version as .github/workflows/mobile-e2e.yml -- keep
      # the two in sync so unit and e2e runs can't drift onto different SDKs.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./mobile
      - name: Run tests
        run: flutter test
        working-directory: ./mobile

  build-docker-arm64:
    needs: [detect-changes, test-api, test-desktop]
    if: |
      always() &&
      needs.detect-changes.outputs.docker == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0
      - name: Build and push ARM64
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          platforms: linux/arm64
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/receipt-wrangler:latest-arm64
          build-args: |
            VERSION=latest
            BUILD_DATE=${{ steps.date.outputs.date }}

  build-docker-amd64:
    needs: [detect-changes, test-api, test-desktop]
    if: |
      always() &&
      needs.detect-changes.outputs.docker == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0
      - name: Build and push AMD64
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          platforms: linux/amd64
          file: ./docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/receipt-wrangler:latest-amd64
          build-args: |
            VERSION=latest
            BUILD_DATE=${{ steps.date.outputs.date }}

  create-docker-manifest:
    needs: [build-docker-arm64, build-docker-amd64]
    if: |
      always() &&
      needs.build-docker-arm64.result == 'success' &&
      needs.build-docker-amd64.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Create Multi-Arch Manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ secrets.DOCKER_USERNAME }}/receipt-wrangler:latest
          sources: |
            ${{ secrets.DOCKER_USERNAME }}/receipt-wrangler:latest-amd64
            ${{ secrets.DOCKER_USERNAME }}/receipt-wrangler:latest-arm64
      - name: Cleanup Architecture-Specific Tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          curl -X DELETE \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/receipt-wrangler/tags/latest-amd64/"

          curl -X DELETE \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/receipt-wrangler/tags/latest-arm64/"
