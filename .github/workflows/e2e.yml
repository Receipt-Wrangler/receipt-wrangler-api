---
name: E2E - Playwright

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'docker/**'
      - '.github/workflows/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # This job and mobile-e2e.yml's android-e2e job drive the SAME backend
    # (secrets.E2E_BASE_URL) and both mutate global System Settings -- e.g. the
    # login-QR toggle, which each suite asserts on. Their workflow-level
    # concurrency groups differ, so this shared job-level group is what keeps
    # them from overlapping.
    #
    # The group is deliberately REF-INDEPENDENT (no github.ref): the backend is
    # one shared resource, so runs must serialize across branches and event
    # types, not just within a ref. mobile-e2e.yml also fires on
    # tech/mobile-e2e and workflow_dispatch, which a ref-scoped group would let
    # run straight through this one.
    #
    # cancel-in-progress must stay false: the point is to queue the second
    # suite, not kill it. Trade-off: GitHub keeps only ONE pending job per
    # group, so a third concurrent contender cancels the older pending job
    # rather than queueing it. That's acceptable -- the mobile jobs are already
    # continue-on-error, and a cancelled run beats two suites corrupting each
    # other's global settings.
    concurrency:
      group: e2e-shared-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
      - name: Install dependencies
        run: npm ci --verbose
        working-directory: ./desktop
      - name: Install Playwright browsers
        run: npm run e2e:install
        working-directory: ./desktop
      - name: Warm up demo backend
        run: |
          curl -fsSL --max-time 60 "$E2E_BASE_URL" > /dev/null || true
          curl -fsSL --max-time 60 "$E2E_BASE_URL/api/featureConfig" > /dev/null || true
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      - name: Run Playwright tests
        run: npm run e2e:ci
        working-directory: ./desktop
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER_USERNAME: ${{ secrets.E2E_USER_USERNAME }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 14
