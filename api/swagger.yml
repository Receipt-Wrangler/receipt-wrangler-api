      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidc/{name}/login:
    get:
      tags:
        - Oidc
      summary: Start an OIDC login
      description:
        Redirects the user agent to the configured identity provider. The API acts as
        the relying party, so the whole exchange (PKCE, state, nonce, code exchange,
        ID token verification) happens server-side and no client ever handles an
        identity provider token. Navigate to this URL; do not fetch it.
      operationId: oidcLogin
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
        - name: client
          in: query
          description:
            Which client is signing in. Mobile receives a single-use exchange code on
            the app's private-use URL scheme instead of session cookies.
          required: false
          schema:
            type: string
            enum:
              - desktop
              - mobile
            default: desktop
        - name: codeChallenge
          in: query
          description:
            The mobile app's own PKCE S256 challenge. Required when client is mobile;
            it binds the resulting exchange code to the app that started the flow.
          required: false
          schema:
            type: string
      responses:
        302:
          description: Redirect to the identity provider, or back to the client on error
      security: []
  /oidc/{name}/callback:
    get:
      tags:
        - Oidc
      summary: OIDC redirect URI
      description:
        Where the identity provider returns the user. This is the exact URL that must
        be registered with the provider. Not called by clients directly.
      operationId: oidcCallback
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        302:
          description: Redirect back to the client, signed in or carrying an error code
      security: []
  /oidc/exchange:
    post:
      tags:
        - Oidc
      summary: Redeem a mobile sign-in code
      description:
        Trades the single-use code the app received on its private-use URL scheme for
        a session. The PKCE verifier is what proves this is the app that started the
        flow, so an app that intercepted the redirect cannot redeem the code. Returns
        the same payload as login with tokensInBody, and never sets a cookie.
      operationId: oidcExchange
      requestBody:
        description: The code and the app's PKCE verifier
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeCommand"
      responses:
        200:
          description: App data, including the token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppData"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security: []
  /oidc/link/{name}:
    get:
      tags:
        - Oidc
      summary: Connect a provider to the signed-in account
      description:
        Starts the same flow as a login, but the session proves who the caller is, so
        the callback links the identity directly instead of matching or provisioning.
        Navigate to this URL; do not fetch it.
      operationId: oidcLinkStart
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
      responses:
        302:
          description: Redirect to the identity provider
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidc/connections:
    get:
      tags:
        - Oidc
      summary: List the caller's connected accounts
      operationId: getOidcConnections
      responses:
        200:
          description: The caller's linked identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcConnectionView"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidc/connections/{name}:
    delete:
      tags:
        - Oidc
      summary: Disconnect a provider from the caller's account
      description:
        Refused when it is the caller's last connection and the account was created by
        that provider, because such an account has no password to fall back on.
      operationId: deleteOidcConnection
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidcProvider/:
    post:
      tags:
        - OidcProvider
      summary: Create an OIDC provider
      operationId: createOidcProvider
      requestBody:
        description: The provider configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOidcProviderCommand"
      responses:
        200:
          description: The created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderView"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidcProvider/{oidcProviderId}:
    get:
      tags:
        - OidcProvider
      summary: Get an OIDC provider
      description: The client secret is never returned; hasClientSecret reports whether one is stored.
      operationId: getOidcProviderById
      parameters:
        - name: oidcProviderId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: The provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderView"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    put:
      tags:
        - OidcProvider
      summary: Update an OIDC provider
      description:
        Omit clientSecret to keep the stored one. The name cannot be changed -- it is
        part of the redirect URI already registered with the identity provider.
      operationId: updateOidcProvider
      parameters:
        - name: oidcProviderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: The provider configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOidcProviderCommand"
      responses:
        200:
          description: The updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderView"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - OidcProvider
      summary: Delete an OIDC provider
      description: Accounts linked to it lose the ability to sign in with it.
      operationId: deleteOidcProvider
      parameters:
        - name: oidcProviderId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /oidcProvider/getPagedOidcProviders:
    post:
      tags:
        - OidcProvider
      summary: Get paged OIDC providers
      operationId: getPagedOidcProviders
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged OIDC providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /permission:
    get:
      tags:
        - Permission
      summary: List all permission descriptors
      description: Returns the full catalog of permission strings the API recognizes, with metadata for UI rendering.
      operationId: getPermissions
      responses:
        200:
          description: All permission descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermissionDescriptor"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /role:
    get:
      tags:
        - Role
      summary: List all roles
      description: Returns the full pool of roles, both app-scoped and group-scoped.
      operationId: getRoles
      responses:
        200:
          description: All roles in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    post:
      tags:
        - Role
      summary: Create role
      description: This will create an app-scoped or group-scoped role.
      operationId: createRole
      requestBody:
        description: Role to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRoleCommand"
      responses:
        200:
          description: The created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /role/{roleId}:
    parameters:
      - in: path
        name: roleId
        schema:
          type: integer
        required: true
        description: Id of the role to update
    put:
      tags:
        - Role
      summary: Update role
      description: >-
        Updates an existing app-scoped or group-scoped role. A role's type
        cannot be changed: the scope in the request must match the existing
        role's scope. System roles cannot be modified.
      operationId: updateRole
      requestBody:
        description: Role to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRoleCommand"
      responses:
        200:
          description: The updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - Role
      summary: Delete role
      description: >-
        Deletes an app-scoped or group-scoped role. The scope query parameter
        disambiguates the role id, since app and group role ids overlap. A role
        cannot be deleted while it is assigned to any user or group member, and
        system roles cannot be deleted.
      operationId: deleteRole
      parameters:
        - in: query
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/PermissionScope"
          description: Scope of the role to delete
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /role/{roleId}/default:
    parameters:
      - in: path
        name: roleId
        schema:
          type: integer
        required: true
        description: Id of the role to make the default for its scope
    put:
      tags:
        - Role
      summary: Set default role
      description: >-
        Makes the role the default for its scope — the role assigned to new
        accounts (APP) or to group creators (GROUP) — clearing the previous
        default. The scope query parameter disambiguates the role id, since app
        and group role ids overlap. System roles may be made default.
      operationId: setDefaultRole
      parameters:
        - in: query
          name: scope
          required: true
          schema:
            $ref: "#/components/schemas/PermissionScope"
          description: Scope of the role to make default
      responses:
        200:
          description: The updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API Key in format v1.xxx.xxx.xxx
  responses:
    Ok:
      description: Request was successfully processed
    BadRequest:
      description: The request was malformed
    NotFound:
      description: The requested resource was not found
    Forbidden:
      description: The request was not allowed
    Unauthorized:
      description: The request was not authorized
    Internal:
      description: There was an error processing the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
  schemas:
    ReceiptStatus:
      description: Status of a receipt
      type: string
      enum:
        - "OPEN"
        - "NEEDS_ATTENTION"
        - "RESOLVED"
        - "DRAFT"
        - "DECLINED"
        - ""
    QuickScanDefaultPaidByType:
      description: How the default paid-by is resolved for optional quick-scan paid-by
      type: string
      enum:
        - "UPLOADER"
        - "USER"
        - ""
    ApiKeyScope:
      description: Scope/permissions for API keys
      type: string
      enum:
        - "r"
        - "w"
        - "rw"
    ItemStatus:
      type: string
      enum:
        - "OPEN"
        - "RESOLVED"
        - "DRAFT"
    GroupStatus:
      type: string
      enum:
        - "ACTIVE"
        - "ARCHIVED"
    FilterOperation:
      type: string
      enum:
        - CONTAINS
        - EQUALS
        - GREATER_THAN
        - LESS_THAN
        - BETWEEN
        - WITHIN_CURRENT_MONTH
        - ""
    Permission:
      description: All permission keys the API recognizes.
      type: string
      enum:
        - "app.users.create"
        - "app.users.read"
        - "app.users.update"
        - "app.users.delete"
        - "app.prompts.create"
        - "app.prompts.read"
        - "app.prompts.update"
        - "app.prompts.delete"
        - "app.categories.create"
        - "app.categories.read"
        - "app.categories.update"
        - "app.categories.delete"
        - "app.tags.create"
        - "app.tags.read"
        - "app.tags.update"
        - "app.tags.delete"
        - "app.custom-fields.create"
        - "app.custom-fields.read"
        - "app.custom-fields.update"
        - "app.custom-fields.delete"
        - "app.system-settings.read"
        - "app.system-settings.update"
        - "app.system-settings.restart-task-server"
        - "app.receipt-processing-settings.create"
        - "app.receipt-processing-settings.read"
        - "app.receipt-processing-settings.update"
        - "app.receipt-processing-settings.delete"
        - "app.system-emails.create"
        - "app.system-emails.read"
        - "app.system-emails.update"
        - "app.system-emails.delete"
        - "app.system-tasks.read"
        - "app.imports.run"
        - "app.groups.create"
        - "app.groups.read"
        - "app.groups.update-settings"
        - "app.groups.delete"
        - "app.api-keys.create"
        - "app.api-keys.read"
        - "app.api-keys.read-any"
        - "app.api-keys.update"
        - "app.api-keys.delete"
        - "app.api-keys.delete-any"
        - "app.oidc-providers.create"
        - "app.oidc-providers.read"
        - "app.oidc-providers.update"
        - "app.oidc-providers.delete"
        - "app.roles.create"
        - "app.roles.read"
        - "app.roles.update"
        - "app.roles.delete"
        - "app.notifications.read"
        - "app.notifications.delete"
        - "app.user-preferences.read"
        - "app.user-preferences.update"
        - "app.account.read"
        - "app.account.update"
        - "app.account.delete"
        - "app.receipts.search"
        - "app.reports.create"
        - "app.reports.delete"
        - "app.reports.duplicate"
        - "app.reports.generate"
        - "app.reports.read"
        - "app.reports.update"
        - "app.reports.readAll"
        - "app.reports.createAll"
        - "app.reports.updateAll"
        - "app.reports.deleteAll"
        - "app.reports.duplicateAll"
        - "app.reports.generateAll"
        - "group.view"
        - "group.update"
        - "group.delete"
        - "group.members.create"
        - "group.members.update"
        - "group.members.delete"
        - "group.members.grants.update"
        - "group.receipts.create"
        - "group.receipts.read"
        - "group.receipts.update"
        - "group.receipts.delete"
        - "group.receipts.duplicate"
        - "group.receipts.magic-fill"
        - "group.receipts.quick-scan"
        - "group.comments.create"
        - "group.comments.delete"
        - "group.dashboards.create"
        - "group.dashboards.read"
        - "group.dashboards.update"
        - "group.dashboards.delete"
        - "group.widgets.read"
        - "group.reports.read"
        - "group.activities.read"
        - "group.activities.rerun"
        - "group.email.poll"
    PermissionScope:
      description: Whether a permission applies app-wide or within a single group.
      type: string
      enum:
        - "APP"
        - "GROUP"
    PermissionDescriptor:
      type: object
      required:
        - key
        - label
        - description
        - category
        - scope
      properties:
        key:
          $ref: "#/components/schemas/Permission"
        label:
          type: string
          description: Short human-readable label for the role editor.
        description:
          type: string
          description: Full description used as tooltip/help text in the role editor.
        category:
          type: string
          description: Logical grouping for the role editor UI (e.g., "User Management", "Receipts").
        scope:
          $ref: "#/components/schemas/PermissionScope"
    Role:
      type: object
      required:
        - id
        - name
        - scope
        - isDefault
        - isSystem
        - permissions
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        description:
          type: string
        scope:
          $ref: "#/components/schemas/PermissionScope"
        isDefault:
          type: boolean
          description: >-
            Whether this role is the default for its scope — assigned to new
            accounts (APP) or to group creators (GROUP). Exactly one role per
            scope is the default.
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        assignedCount:
          type: integer
          description: Number of users or group members currently assigned this role
        categoryGrants:
          type: array
          description: >-
            Category ids a GROUP role restricts its members to. Empty means
            unrestricted (members may use every category). Always empty for app
            roles.
          items:
            type: integer
            format: uint64
        tagGrants:
          type: array
          description: >-
            Tag ids a GROUP role restricts its members to. Empty means
            unrestricted (members may use every tag). Always empty for app roles.
          items:
            type: integer
            format: uint64
        paidByUserGrants:
          type: array
          description: >-
            User ids whose receipts a GROUP role lets its members see (by the
            receipt's "paid by" user). Empty with includeOwnPaidReceipts false
            means unrestricted (members see every payer's receipts). Always empty
            for app roles.
          items:
            type: integer
            format: uint64
        includeOwnPaidReceipts:
          type: boolean
          description: >-
            Whether a GROUP role lets each member see receipts they paid for. Part
            of the paid-by visibility filter; always false for app roles.
        seesAllMembers:
          type: boolean
          description: >-
            Whether a GROUP role exempts its members from member-presence isolation
            (they see, and are seen by, every member of an isolated group). Always
            false for app roles.
        skipDefaultGroupCreation:
          type: boolean
          description: >-
            Whether users created with this APP role skip the automatic personal
            "My Receipts" group. The virtual "All" group is always created. Applies
            at user-creation time only — changing it never adds or removes a group
            for an existing user. Always false for group roles.
        requiresIndividualCategoryGrants:
          type: boolean
          description: >-
            Whether a GROUP role requires per-member category assignment. When true, a
            member holding this role with no individual category grants sees NO
            categories, rather than falling back to the role's set. Always false for
            app roles.
        requiresIndividualTagGrants:
          type: boolean
          description: >-
            Tag counterpart of requiresIndividualCategoryGrants. Always false for app
            roles.
        reportTemplateGrants:
          type: array
          description: >-
            Per-template action grants restricting which report templates a GROUP
            role's members may act on. Empty means unrestricted (every template the
            role's group access reaches). Always empty for app roles.
          items:
            $ref: "#/components/schemas/ReportTemplateGrant"
    UpsertRoleCommand:
      type: object
      required:
        - name
        - scope
        - permissions
      properties:
        name:
          type: string
        description:
          type: string
        scope:
          $ref: "#/components/schemas/PermissionScope"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        categoryGrants:
          type: array
          description: >-
            Category ids to restrict a GROUP role's members to. Only valid on
            group roles; omit or leave empty for unrestricted access.
          items:
            type: integer
            format: uint64
        tagGrants:
          type: array
          description: >-
            Tag ids to restrict a GROUP role's members to. Only valid on group
            roles; omit or leave empty for unrestricted access.
          items:
            type: integer
            format: uint64
        paidByUserGrants:
          type: array
          description: >-
            User ids whose receipts a GROUP role's members may see (by the
            receipt's "paid by" user). Only valid on group roles; omit or leave
            empty (with includeOwnPaidReceipts false) for unrestricted access.
          items:
            type: integer
            format: uint64
        includeOwnPaidReceipts:
          type: boolean
          description: >-
            Whether to also let each member see receipts they paid for. Only valid
            on group roles.
        seesAllMembers:
          type: boolean
          description: >-
            Whether a GROUP role exempts its members from member-presence isolation
            (they see, and are seen by, every member of an isolated group). Only
            valid on group roles.
        skipDefaultGroupCreation:
          type: boolean
          description: >-
            Whether users created with this APP role skip the automatic personal
            "My Receipts" group (the virtual "All" group is always created). Only
            valid on app roles; applies at user-creation time only.
        requiresIndividualCategoryGrants:
          type: boolean
          description: >-
            Whether this GROUP role requires per-member category assignment. When
            true, a member with no individual category grants sees NO categories
            instead of falling back to the role's set, so an unassigned member fails
            closed. Only valid on group roles.
        requiresIndividualTagGrants:
          type: boolean
          description: >-
            Tag counterpart of requiresIndividualCategoryGrants. Only valid on group
            roles.
        reportTemplateGrants:
          type: array
          description: >-
            Per-template action grants for a GROUP role, restricting which report
