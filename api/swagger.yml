        - name
        - groupId
      properties:
        name:
          type: string
          description: Dashboard name
        groupId:
          type: string
          description: Group foreign key
        widgets:
          type: array
          description: Widgets associated to dashboard
          items:
            $ref: "#/components/schemas/UpsertWidgetCommand"
    UpsertWidgetCommand:
      type: object
      required:
        - widgetType
      properties:
        name:
          type: string
          description: Widget name
        widgetType:
          type: string
          $ref: "#/components/schemas/WidgetType"
          description: Type of widget
        configuration:
          type: object
          additionalProperties: { }
          description: Configuration of widget
    AppData:
      type: object
      required:
        - about
        - claims
        - groups
        - users
        - userPreferences
        - featureConfig
        - categories
        - tags
        - currencyDisplay
        - icons
        - appPermissions
        - groupPermissions
      properties:
        about:
          $ref: "#/components/schemas/About"
        claims:
          $ref: "#/components/schemas/Claims"
        groups:
          type: array
          description: Groups in the system
          items:
            $ref: "#/components/schemas/Group"
        users:
          type: array
          description: Users in the system
          items:
            $ref: "#/components/schemas/UserView"
        userPreferences:
          $ref: "#/components/schemas/UserPreferences"
        featureConfig:
          $ref: "#/components/schemas/FeatureConfig"
        categories:
          type: array
          description: Categories in the system
          items:
            $ref: "#/components/schemas/Category"
        tags:
          type: array
          description: Tags in the system
          items:
            $ref: "#/components/schemas/Tag"
        jwt:
          type: string
          description: JWT token
        refreshToken:
          type: string
          description: Refresh token
        currencyDisplay:
          type: string
          description: Currency display
        currencyThousandthsSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencyDecimalSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencySymbolPosition:
          $ref: "#/components/schemas/CurrencySymbolPosition"
        currencyHideDecimalPlaces:
          type: boolean
          description: Whether to hide decimal places
        icons:
          type: array
          description: Icons in the system
          items:
            $ref: "#/components/schemas/Icon"
        appPermissions:
          type: array
          description: >-
            The calling user's effective app-level permissions. Deliberately
            typed as plain strings rather than the Permission enum: this is
            server-resolved data, not a contract. A granted entry may be a
            wildcard (e.g. "app.*"), which is not an enum member, and a client
            built before a newly added permission must still be able to parse
            the payload. Clients match these with the wildcard matcher.
          items:
            type: string
        groupPermissions:
          type: object
          description: >-
            The calling user's effective group-level permissions, keyed by group
            id. Plain strings for the same reason as appPermissions.
          additionalProperties:
            type: array
            items:
              type: string
        groupCategories:
          type: object
          description: >-
            The categories the calling user may use in each group, keyed by group
            id. Filtered to the user's group-role grants (the full pool when
            unrestricted). Non-admins receive categories only through this map.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Category"
        groupTags:
          type: object
          description: >-
            The tags the calling user may use in each group, keyed by group id.
            Filtered to the user's group-role grants (the full pool when
            unrestricted). Non-admins receive tags only through this map.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Tag"
