        status:
          $ref: "#/components/schemas/PagedRequestField"
        group:
          $ref: "#/components/schemas/PagedRequestField"
        resolvedDate:
          $ref: "#/components/schemas/PagedRequestField"
        createdAt:
          $ref: "#/components/schemas/PagedRequestField"
    PagedRequestField:
      type: object
      description: "Contains two keys: operation of type FilterOperation and value which can a different type depending on the field."
    SearchResult:
      required:
        - id
