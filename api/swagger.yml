        name:
          type: string
        type:
          type: string
        groupId:
          type: integer
        date:
          type: string
        amount:
          type: string
        receiptStatus:
          $ref: "#/components/schemas/ReceiptStatus"
        paidByUserId:
          type: integer
        createdAt:
          type: string
    PagedData:
      required:
        - data
        - totalCount
      type: object
      properties:
        data:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/Receipt"
              - $ref: "#/components/schemas/Category"
              - $ref: "#/components/schemas/Tag"
              - $ref: "#/components/schemas/Prompt"
              - $ref: "#/components/schemas/Group"
              - $ref: "#/components/schemas/TagView"
              - $ref: "#/components/schemas/SystemTask"
              - $ref: "#/components/schemas/ReceiptProcessingSettings"
              - $ref: "#/components/schemas/SystemEmail"
              - $ref: "#/components/schemas/Activity"
              - $ref: "#/components/schemas/CustomField"
              - $ref: "#/components/schemas/ReportTemplate"
              - $ref: "#/components/schemas/UserView"
        totalCount:
          type: integer
    FeatureConfig:
      required:
        - enableLocalSignUp
        - aiPoweredReceipts
      type: object
      properties:
        aiPoweredReceipts:
          type: boolean
          description: Whether AI powered receipts are enabled
        enableLocalSignUp:
          type: boolean
          description: Whether local sign up is enabled
        loginQrUrl:
          type: string
          description: Composed deep link the desktop login page encodes as a QR; empty unless the login QR is enabled with a mobile server URL
        oidcProviders:
          type: array
          description:
            Enabled OIDC identity providers, so a login screen can render one button
            per provider. Always present as an array (never null) and carries only the
            slug and display name -- never the issuer, client id, or any secret.
          items:
            $ref: "#/components/schemas/OidcProviderSummary"
    OidcProviderSummary:
      required:
        - name
        - displayName
      type: object
      properties:
        name:
          type: string
          description: The provider's slug, used to build its login URL
        displayName:
          type: string
          description: Rendered to users as "Log in with {displayName}"
    OidcProviderView:
      required:
        - id
        - name
        - displayName
        - issuerUrl
        - clientId
        - scope
        - allowProvisioning
        - linkByUsername
        - enabled
        - hasClientSecret
        - redirectUri
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: URL slug for this provider; immutable after creation
        displayName:
          type: string
        issuerUrl:
          type: string
          description: OIDC discovery base, e.g. https://accounts.google.com
        clientId:
          type: string
        scope:
          type: string
          description: Space-separated OIDC scopes; must include openid
        allowProvisioning:
          type: boolean
          description: Create a local account for an identity we have never seen
        linkByUsername:
          type: boolean
          description:
            On a first login only, attach to an existing local account whose username
            equals the preferred_username claim. Off by default; that claim is neither
            stable nor unique, and some providers recycle released usernames.
        enabled:
          type: boolean
        hasClientSecret:
          type: boolean
          description: Whether a secret is stored. The secret itself is never returned.
        redirectUri:
          type: string
          description: The exact redirect URI to register with the identity provider
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertOidcProviderCommand:
      required:
        - name
        - displayName
        - issuerUrl
        - clientId
        - scope
      type: object
      properties:
        name:
          type: string
          description:
            URL slug. Lowercase letters, numbers and dashes. Cannot be changed after
            creation, and cannot be one of the reserved words login, callback, link,
            exchange or connections.
        displayName:
          type: string
        issuerUrl:
          type: string
          description: Must use https unless the host is localhost
        clientId:
          type: string
        clientSecret:
          type: string
          description:
            Omit on update to keep the stored secret. Required on create.
        scope:
          type: string
          description: Space-separated OIDC scopes; must include openid
        allowProvisioning:
          type: boolean
        linkByUsername:
          type: boolean
        enabled:
          type: boolean
    OidcConnectionView:
      required:
        - providerName
        - providerDisplayName
        - provisionedUser
        - linkedAt
      type: object
      properties:
        providerName:
          type: string
        providerDisplayName:
          type: string
        preferredUsername:
          type: string
        email:
          type: string
        provisionedUser:
          type: boolean
          description:
            Whether this connection created the local account. Such an account has no
            usable password, so its last connection cannot be removed.
        linkedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
    OidcExchangeCommand:
      required:
        - code
        - codeVerifier
      type: object
      properties:
        code:
          type: string
          description: The single-use code delivered to the app's callback URL
        codeVerifier:
          type: string
          description: The PKCE verifier the app generated before starting the flow
    MagicFillCommand:
