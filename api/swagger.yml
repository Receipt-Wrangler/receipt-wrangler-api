  /group/{groupId}/member/{userId}/grants:
    put:
      tags:
        - Groups
      summary: Update a group member's category and tag assignment
      description: >-
        Replaces one member's per-member category/tag grants. These narrow WITHIN
        the ceiling set by the member's group role — the two layers intersect — so
        every submitted id must be one the role already allows, or the request is
        rejected with 400. Duplicate ids within either array are also rejected
        with 400.


        An empty array clears that resource's restriction. What the member then
        sees depends on their group role: when the role's
        requiresIndividualCategoryGrants (resp. requiresIndividualTagGrants) is
        false — the default — they fall back to the role's set; when it is true
        the assignment is mandatory, so clearing it leaves them seeing NOTHING for
        that resource. That is deliberate: it fails closed, so forgetting to
        assign a newly added member cannot silently widen their visibility.


        Deliberately a dedicated endpoint rather than a field on the group-member
        upsert: it carries its own permission (group.members.grants.update), so a
        member who can manage the roster cannot thereby widen their own visibility.
      operationId: updateGroupMemberGrants
      parameters:
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
          description: Group the membership belongs to
        - in: path
          name: userId
          schema:
            type: integer
          required: true
          description: Member whose assignment is being replaced
      requestBody:
        description: The category and tag ids to assign
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupMemberGrantsCommand"
      responses:
        200:
          description: The member's updated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateGroupMemberGrantsCommand"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
