              type: boolean
              description: Whether to hide decimal places
              default: false
            debugOcr:
              type: boolean
              description: Debug OCR
              default: false
            numWorkers:
              type: integer
              description: Number of workers to use
              default: 1
            emailPollingInterval:
              type: integer
              description: Email polling interval
              default: 1800
            receiptProcessingSettingsId:
              type: integer
              description: Receipt processing settings foreign key
            fallbackReceiptProcessingSettingsId:
              type: integer
              description: Fallback receipt processing settings foreign key
            taskConcurrency:
              type: integer
              description: Concurrency for task worker
              default: 10
            pdfDpi:
              type: integer
              description: DPI used when rasterizing PDFs for OCR/vision processing
              default: 300
            taskQueueConfigurations:
              type: array
              items:
                $ref: "#/components/schemas/TaskQueueConfiguration"
            mcpEnabled:
              type: boolean
              description: Whether the OAuth 2.1-protected MCP server is enabled
              default: false
            mcpPublicUrl:
              type: string
              description: Externally reachable origin used for MCP OAuth/metadata/redirect URLs and token audience
            serverPublicUrl:
              type: string
              description: Externally reachable origin of this API, used to build each OIDC provider's redirect URI. Separate from mcpPublicUrl, which is bound into the MCP token audience.
            showLoginQr:
              type: boolean
              description: Whether to show the mobile-setup QR code on the desktop login page
              default: false
            mobileServerUrl:
              type: string
              description: Server/API URL mobile clients connect to; encoded into the login QR's deep link
            refreshTokenValidForHours:
              type: integer
              description: >-
                How long a refresh token stays valid, in hours. Refresh tokens rotate on every use,
                so this is how long a user can be away and still return signed in, not an absolute
                session cap. 1-720 (30 days); 0 means unset and falls back to the default.
              default: 24
            mcpRefreshTokenValidForHours:
              type: integer
              description: >-
                The same for MCP/OAuth connector refresh tokens, kept separate so a long window
                chosen for human convenience does not extend third-party client tokens.
                1-720 (30 days); 0 means unset and falls back to the default.
              default: 24
    UpsertSystemSettingsCommand:
      type: object
      required:
        - currencyThousandthsSeparator
        - currencyDecimalSeparator
        - currencyHideDecimalPlaces
        - currencySymbolPosition
        - taskConcurrency
      properties:
        enableLocalSignUp:
          type: boolean
          description: Whether local sign up is enabled
        currencyDisplay:
          type: string
          description: Currency display
        currencyThousandthsSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencyDecimalSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencySymbolPosition:
          $ref: "#/components/schemas/CurrencySymbolPosition"
        currencyHideDecimalPlaces:
          type: boolean
          description: Whether to hide decimal places
        debugOcr:
          type: boolean
        numWorkers:
          type: integer
          description: Number of workers to use
          default: 1
        emailPollingInterval:
          type: integer
          description: Email polling interval
        receiptProcessingSettingsId:
          type: integer
          description: Receipt processing settings foreign key
        fallbackReceiptProcessingSettingsId:
          type: integer
          description: Fallback receipt processing settings foreign key
        taskConcurrency:
          type: integer
          description: Concurrency for task worker
        pdfDpi:
          type: integer
          description: DPI used when rasterizing PDFs for OCR/vision processing
          minimum: 72
          maximum: 1200
        taskQueueConfigurations:
          type: array
          items:
            $ref: "#/components/schemas/UpsertTaskQueueConfiguration"
        mcpEnabled:
          type: boolean
          description: Whether the OAuth 2.1-protected MCP server is enabled
        mcpPublicUrl:
          type: string
          description: Externally reachable origin used for MCP OAuth/metadata/redirect URLs and token audience
        serverPublicUrl:
          type: string
          description: Externally reachable origin of this API, used to build each OIDC provider's redirect URI. Separate from mcpPublicUrl, which is bound into the MCP token audience.
        showLoginQr:
          type: boolean
          description: Whether to show the mobile-setup QR code on the desktop login page
        mobileServerUrl:
          type: string
          description: Server/API URL mobile clients connect to; encoded into the login QR's deep link
        refreshTokenValidForHours:
          type: integer
          description: >-
            How long a refresh token stays valid, in hours. Accepted values are 1-720 (30 days), or
            0 meaning unset, which falls back to the default of 24. Omit the key entirely to leave
            the currently configured value unchanged.
          minimum: 0
          maximum: 720
        mcpRefreshTokenValidForHours:
          type: integer
          description: >-
            How long an MCP/OAuth connector refresh token stays valid, in hours. Accepted values are
            1-720 (30 days), or 0 meaning unset, which falls back to the default of 24. Omit the key
            entirely to leave the currently configured value unchanged.
          minimum: 0
          maximum: 720
