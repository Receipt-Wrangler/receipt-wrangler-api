openapi: 3.1.0
info:
  title: Receipt Wrangler API.
  termsOfService:
    there are no TOS at this moment, use at your own risk we take no
    responsibility
  license:
    name: GPLV3
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  version: 5.0.0
servers:
  - url: /api
security:
  - bearerAuth: [ ]
  - apiKeyAuth: [ ]
paths:
  /dashboard/{groupId}:
    parameters:
      - in: path
        name: groupId
        schema:
          type: string
        required: true
        description: Id of group to get dashboard for
    get:
      tags:
        - Dashboard
      summary: Get dashboards for a user by group id
      description: This will get a dashboards for a user by group id
      operationId: getDashboardsForUserByGroupId
      responses:
        200:
          description: The dashboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dashboard"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /dashboard/{dashboardId}:
    parameters:
      - in: path
        name: dashboardId
        schema:
          type: integer
        required: true
        description: Id of dashboard to operate on
    put:
      tags:
        - Dashboard
      summary: Update dashboard
      description: This will update a dashboard
      operationId: updateDashboard
      requestBody:
        description: Dashboard to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDashboardCommand"
      responses:
        200:
          description: The updated dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - Dashboard
      summary: Delete dashboard
      description: This will delete a dashboard by id
      operationId: deleteDashboard
      responses:
        200:
          description: The deleted dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /dashboard/:
    post:
      tags:
        - Dashboard
      summary: Create dashboard
      description: This will create a dashboard [SYSTEM USER]
      requestBody:
        description: Dashboard
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertDashboardCommand"
      operationId: createDashboard
      responses:
        200:
          description: The created dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /widget/pieChart/{groupId}:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of group to get pie chart data for
    post:
      tags:
        - Widget
      summary: Get pie chart data
      description: This will get pie chart data for a group based on the specified grouping
      operationId: getPieChartData
      requestBody:
        description: Pie chart data request
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PieChartDataCommand"
      responses:
        200:
          description: The pie chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PieChartData"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/generate:
    post:
      tags:
        - Report
      summary: Generate a report
      description:
        Generates a report over the receipts of one or more groups and streams it
        back as a file, or a zip when several formats are requested. Runs under the
        caller's group permissions and requires group.reports.read in every covered
        group.
      operationId: generateReport
      requestBody:
        description: The report builder configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The generated report file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/preview:
    post:
      tags:
        - Report
      summary: Preview a report
      description:
        Renders the current report configuration as HTML for the builder's live
        preview, along with the number of receipts it covers. Requires the
        app-level app.reports.read (or app.reports.readAll) and group.reports.read
        in every covered group. The preview is a row-capped sample of the engine's
        own output.
      operationId: previewReport
      requestBody:
        description: The report builder configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPreviewResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template:
    post:
      tags:
        - Report
      summary: Save a report template
      description:
        Saves the current report configuration as a reusable template. App-scoped
        (requires app.reports.create) — it persists a configuration and touches no
        group's receipts.
      operationId: createReportTemplate
      requestBody:
        description: The report builder configuration to save
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The saved report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/list:
    post:
      tags:
        - Report
      summary: Get paged report templates
      description:
        Returns a paged, sorted list of saved report templates. App-scoped
        (requires app.reports.read).
      operationId: getReportTemplates
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged report templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/options:
    get:
      tags:
        - Report
      summary: Get report template options
      description:
        Returns every report template as a lightweight {id, name, groupIds} option
        for the role-form access matrix. Gated on app.roles.read (the admin role
        editor may not personally hold report permissions), not a report permission.
      operationId: getReportTemplateOptions
      responses:
        200:
          description: The report template options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportTemplateOption"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/{id}:
    get:
      tags:
        - Report
      summary: Get a report template
      description:
        Returns a saved report template by id. Access is resolved per template
        (readAll, or the per-group ceiling plus the per-template matrix).
      operationId: getReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to get
      responses:
        200:
          description: The report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    put:
      tags:
        - Report
      summary: Update a report template
      description:
        Updates a saved report template in place, replacing its name and stored
        configuration. App-scoped (requires app.reports.update).
      operationId: updateReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to update
      requestBody:
        description: The report builder configuration to save over the existing template
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The updated report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - Report
      summary: Delete a report template
      description: Deletes a saved report template by id. Requires app.reports.delete.
      operationId: deleteReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to delete
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/{id}/duplicate:
    post:
      tags:
        - Report
      summary: Duplicate a report template
      description:
        Duplicates a saved report template by id, returning the new copy. App-scoped
        (requires app.reports.duplicate).
      operationId: duplicateReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to duplicate
      responses:
        200:
          description: The duplicated report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/{id}/generate:
    post:
      tags:
        - Report
      summary: Generate a report from a saved template
      description:
        Generates a saved report template by id and streams the file. Enforces the
        per-template generate grant (generateAll, or the per-group ceiling plus the
        matrix), loading the stored configuration server-side.
      operationId: generateReportFromTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to generate
      responses:
        200:
          description: The generated report file (or a zip of several formats)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /report/template/{id}/render:
    post:
      tags:
        - Report
      summary: Render a saved template as HTML for the dashboard report widget
      description:
        Renders a saved report template by id as a self-contained HTML document
        over the full dataset (unlike /report/preview, which caps the sample) for
        the dashboard report widget, loading the stored configuration server-side.
        Re-resolves the caller's access on every call; when the caller may not view
        the template (or it was deleted) a restricted-notice HTML document is
        returned at 200 with empty allowedActions, so the widget always has HTML to
        render. allowedActions carries the actions the caller may perform (drives
        the widget's download button).
      operationId: renderReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to render
      responses:
        200:
          description: The rendered report (or restricted notice) HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPreviewResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /category/{categoryName}:
    parameters:
      - in: path
        name: categoryName
        schema:
          type: string
        required: true
        description: Category name to get count of
    get:
      tags:
        - Category
      summary: Get category count by name
      description: This will return a count of categories with the same name
      operationId: getCategoryCountByName
      responses:
        200:
          description: The number of categories with the same name
          content:
            text/plain:
              schema:
                type: integer
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /category/getPagedCategories:
    post:
      tags:
        - Category
      summary: Get paged categories
      description: This will return paged categories
      operationId: getPagedCategories
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /category/:
    get:
      tags:
        - Category
      summary: Get all categories
      description: This will return all categories in the system
      operationId: getAllCategories
      responses:
        200:
          description: All categories in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    post:
      tags:
        - Category
      summary: Create category
      description: This will create a category
      operationId: createCategory
      requestBody:
        description: Category to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        200:
          description: The created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /category/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        schema:
          type: integer
        required: true
        description: Category Id to get
    put:
      tags:
        - Category
      summary: Update category
      description: This will update a category
      operationId: updateCategory
      requestBody:
        description: Category to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - Category
      summary: Delete category
      description: This will delete a category by id
      operationId: deleteCategory
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /comment/:
    post:
      tags:
        - Comment
      summary: Add comment
      description: This will add a comment to a receipt, [SYSTEM USER]
      requestBody:
        description: Comment to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCommentCommand"
      operationId: addComment
      responses:
        200:
          description: The created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /comment/{commentId}:
    delete:
      tags:
        - Comment
      summary: Delete comment
      description: This will delete a comment by id [SYSTEM User]
      parameters:
        - in: path
          name: commentId
          schema:
            type: integer
          required: true
          description: Comment Id to delete
      operationId: deleteComment
      responses:
        200:
          $ref: "#/components/responses/Ok"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /customField/:
    post:
      tags:
        - CustomField
      summary: Create custom field
      description: This will create a custom field
      operationId: createCustomField
      requestBody:
        description: Custom field to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCustomFieldCommand"
      responses:
        200:
          description: Created custom field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomField"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /customField/{customFieldId}:
    parameters:
      - in: path
        name: customFieldId
        schema:
          type: integer
        required: true
        description: Custom field Id to get
    get:
      tags:
        - CustomField
      summary: Get custom field
      description: This will get a custom field by id
      operationId: getCustomFieldById
      responses:
        200:
          description: The custom field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomField"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    put:
      tags:
        - CustomField
      summary: Update custom field
      description:
        This will update a custom field's name, description, and select options.
        The custom field's type is immutable and cannot be changed. Options may be
        renamed or added, but never removed.
      operationId: updateCustomField
      requestBody:
        description: Custom field data to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCustomFieldCommand"
      responses:
        200:
          description: The updated custom field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomField"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    delete:
      tags:
        - CustomField
      summary: Delete custom field
      description: This will delete a custom field by id
      operationId: deleteCustomField
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /customField/getPagedCustomFields:
    post:
      tags:
        - CustomField
      summary: Get paged custom fields
      description: This will return paged custom fields
      operationId: getPagedCustomFields
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /export/{groupId}:
    post:
      tags:
        - Export
      summary: Exports receipts
      description:
        This will export all receipts that belong to a group based on a filter [SYSTEM
        USER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptPagedRequestCommand"
      parameters:
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/ExportFormat"
          required: true
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
          description: Get all receipts that belong to groupId
      operationId: exportReceiptsForGroup
      responses:
        200:
          description: The csv stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /export:
    post:
      tags:
        - Export
      summary: Exports receipts
      description:
        This will export individual receipts [SYSTEM USER]
      parameters:
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/ExportFormat"
          required: true
        - in: query
          name: receiptIds
          schema:
            type: array
            items:
              type: integer
      operationId: exportReceiptsById
      responses:
        200:
          description: The csv stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
  /featureConfig:
    get:
      tags:
        - FeatureConfig
      summary: Get feature config
      description: This will get the server's feature config
      operationId: getFeatureConfig
      responses:
        200:
          description: The feature config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureConfig"
        500:
          $ref: "#/components/responses/Internal"
      security: []
  /group:
    get:
      tags:
        - Groups
      summary: Get groups for user
      description: This will get groups for the currently logged in user
      operationId: getGroupsForuser
      responses:
        200:
          description: The groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
        - apiKeyAuth: [ ]
    post:
      tags:
        - Groups
      summary: Create group
      description: This will create a group
      requestBody:
        description: Group to create
        required: true
        content:
          application/json:
