            description: Files to quick scan
        groupIds:
          type: array
          items:
            type: integer
            description: Group foreign key
        paidByUserIds:
          type: array
          items:
            type: integer
            description: User foreign key
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptStatus"
        categoryIds:
          type: array
          items:
            type: string
            description: Comma-joined category ids for the file at the same index
        tagIds:
          type: array
          items:
            type: string
            description: Comma-joined tag ids for the file at the same index
        comments:
          type: array
          items:
            type: string
            maxLength: 500
            description: Comment for the file at the same index (empty for none)
    UserPreferences:
