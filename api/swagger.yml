              description: Name of the shortcut
            url:
              type: string
              description: Destination of the shortcut
            icon:
              type: string
              description: Icon of shortcut
    GroupReceiptSettings:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - groupId
          properties:
            groupId:
              type: integer
              description: Group foreign key
            hideImages:
              type: boolean
              description: Hide receipt images
            hideReceiptCategories:
              type: boolean
              description: Hide receipt categories
            hideReceiptTags:
              type: boolean
              description: Hide receipt tags
            hideItemCategories:
              type: boolean
              description: Hide receipt item categories
            hideItemTags:
              type: boolean
              description: Hide receipt item tags
            hideComments:
              type: boolean
              description: Hide receipt comments
            hideShareCategories:
              type: boolean
              description: Hide share categories
            hideShareTags:
              type: boolean
              description: Hide share tags
            quickScanPaidByEnabled:
              type: boolean
              description: Show the paid by field in quick scan
            quickScanPaidByRequired:
              type: boolean
              description: Require the paid by field in quick scan
            quickScanDefaultPaidByType:
              $ref: "#/components/schemas/QuickScanDefaultPaidByType"
            quickScanDefaultPaidById:
              type: integer
              nullable: true
              description: Default paid by user id when paid by is optional and type is USER
            quickScanStatusEnabled:
              type: boolean
              description: Show the status field in quick scan
            quickScanStatusRequired:
              type: boolean
              description: Require the status field in quick scan
            quickScanDefaultStatus:
              $ref: "#/components/schemas/ReceiptStatus"
            quickScanCategoriesEnabled:
              type: boolean
              description: Show the categories field in quick scan
            quickScanCategoriesRequired:
              type: boolean
              description: Require the categories field in quick scan
            quickScanTagsEnabled:
              type: boolean
              description: Show the tags field in quick scan
            quickScanTagsRequired:
              type: boolean
              description: Require the tags field in quick scan
            quickScanCommentEnabled:
              type: boolean
              description: Show the comment field in quick scan
            quickScanCommentRequired:
              type: boolean
              description: Require the comment field in quick scan
            defaultCustomFieldIds:
              type: array
              description: >-
                Custom field ids that are pre-added to every receipt created for this
                group. Always present; an empty array means the group has configured
                none. Read only here - write via
                UpdateGroupReceiptSettingsCommand.defaultCustomFieldIds.
              items:
                type: integer
                format: uint64
            applyDefaultCustomFieldsOnIngest:
              type: boolean
              description: >-
                Also attach the group's default custom fields to receipts the SERVER
                creates (quick scan, email integration). Off by default.
    UpdateGroupReceiptSettingsCommand:
      type: object
      properties:
        hideImages:
          type: boolean
          description: Hide receipt images
        hideReceiptCategories:
          type: boolean
          description: Hide receipt categories
        hideReceiptTags:
          type: boolean
          description: Hide receipt tags
        hideItemCategories:
          type: boolean
          description: Hide receipt item categories
        hideItemTags:
          type: boolean
          description: Hide receipt item tags
        hideComments:
          type: boolean
          description: Hide receipt comments
        hideShareCategories:
          type: boolean
          description: Hide share categories
        hideShareTags:
          type: boolean
          description: Hide share tags
        quickScanPaidByEnabled:
          type: boolean
          description: Show the paid by field in quick scan
        quickScanPaidByRequired:
          type: boolean
          description: Require the paid by field in quick scan
        quickScanDefaultPaidByType:
          $ref: "#/components/schemas/QuickScanDefaultPaidByType"
        quickScanDefaultPaidById:
          type: integer
          nullable: true
          description: Default paid by user id when paid by is optional and type is USER
        quickScanStatusEnabled:
          type: boolean
          description: Show the status field in quick scan
        quickScanStatusRequired:
          type: boolean
          description: Require the status field in quick scan
        quickScanDefaultStatus:
          $ref: "#/components/schemas/ReceiptStatus"
        quickScanCategoriesEnabled:
          type: boolean
          description: Show the categories field in quick scan
        quickScanCategoriesRequired:
          type: boolean
          description: Require the categories field in quick scan
        quickScanTagsEnabled:
          type: boolean
          description: Show the tags field in quick scan
        quickScanTagsRequired:
          type: boolean
          description: Require the tags field in quick scan
        quickScanCommentEnabled:
          type: boolean
          description: Show the comment field in quick scan
        quickScanCommentRequired:
          type: boolean
          description: Require the comment field in quick scan
        defaultCustomFieldIds:
          type: array
          description: >-
            Custom field ids to pre-add to every receipt created for this group.
            OMIT the key to leave the configured set unchanged (clients that hide
            this section, e.g. for a user without app.custom-fields.read, must omit
            it); send an empty array to clear it. Requires app.custom-fields.read -
            a caller without it gets a 403.
          items:
            type: integer
            format: uint64
        applyDefaultCustomFieldsOnIngest:
          type: boolean
          description: >-
            Also attach the group's default custom fields to receipts the SERVER
            creates (quick scan, email integration). OMIT the key to leave the
            stored value unchanged.
    GroupSettings:
