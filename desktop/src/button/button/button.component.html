@switch (matButtonType()) {
  @case ('basic') {
    <button
      mat-button
      [class]="buttonClass()"
      [type]="type()"
      [color]="color()"
      [disabled]="disabled()"
      [matTooltip]="tooltip()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      (click)="emitClicked($event)"
    >
      <div class="d-flex align-items-center">
        @if (icon) {
          <mat-icon class="me-1">
            {{ icon }}
          </mat-icon>
        }
        <span>
          <strong>
            {{ buttonText() }}
          </strong>
        </span>
      </div>
    </button>
  }

  @case ('matRaisedButton') {
    <button
      mat-raised-button
      [class]="buttonClass()"
      [type]="type()"
      [color]="color()"
      [disabled]="disabled()"
      [matTooltip]="tooltip()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      (click)="emitClicked($event)"
    >
      <div class="d-flex align-items-center">
        @if (icon) {
          <mat-icon class="me-1">
            {{ icon }}
          </mat-icon>
        }
        <span>
          <strong>
            {{ buttonText() }}
          </strong>
        </span>
      </div>
    </button>
  }

  @case ('iconButton') {
    <button
      mat-icon-button
      [class]="buttonClass()"
      [type]="type()"
      [color]="color()"
      [disabled]="disabled()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      [matTooltip]="tooltip()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      (click)="emitClicked($event)"
    >
      @if (customIcon) {
        <mat-icon [svgIcon]="customIcon"></mat-icon>
      }
      @if (icon) {
        <mat-icon>
          {{ icon }}
        </mat-icon>
      }
    </button>
  }
}
