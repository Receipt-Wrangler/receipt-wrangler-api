<carousel
  [interval]="0"
  [isAnimated]="true"
  [activeSlide]="currentlyShownImageIndex"
  (activeSlideChange)="updateCurrentlyShownImage($event)"
>
  <slide *ngFor="let preview of imagePreviews(); let i = index">
    <ng-template
      [ngTemplateOutlet]="buttonControls"
      [ngTemplateOutletContext]="{
        i: i,
      }"
    ></ng-template>

    <!--
      Deliberately unconditional: the header zoom buttons index a viewChildren
      query by SLIDE index, so gating the viewer here would compact that query
      and point them at the wrong slide. The viewer renders nothing without a
      source anyway.
    -->
    <app-image-viewer
      [imageBase64]="preview?.encodedImage"
      [imageFile]="$any(preview.file)"
      [stageHeight]="stageHeight()"
    ></app-image-viewer>
  </slide>

  <slide *ngFor="let image of images(); let i = index">
    <ng-template
      [ngTemplateOutlet]="buttonControls"
      [ngTemplateOutletContext]="{
        i: i,
      }"
    ></ng-template>

    <!-- Unconditional for the same reason as the loop above. -->
    <app-image-viewer
      [imageBase64]="image.encodedImage"
      [stageHeight]="stageHeight()"
    ></app-image-viewer>
  </slide>
</carousel>

<ng-template #buttonControls let-i="i">
  @if (!hideButtonControls()) {
    <div class="row justify-content-center">
      <app-button
        class="col-auto"
        matButtonType="iconButton"
        icon="zoom_in"
        tooltip="Zoom In"
        [disabled]="disabled()"
        (clicked)="zoomIn()"
      ></app-button>
      <app-button
        class="col-auto"
        matButtonType="iconButton"
        icon="zoom_out"
        tooltip="Zoom Out"
        [disabled]="disabled()"
        (clicked)="zoomOut()"
      ></app-button>
      @if (!(mode() | inputReadonly)) {
        <app-button
          class="col-auto"
          matButtonType="iconButton"
          icon="delete"
          tooltip="Remove Image"
          color="warn"
          [disabled]="disabled()"
          (clicked)="emitRemoveButtonClicked(i)"
        ></app-button>
      }
    </div>
  }
</ng-template>
