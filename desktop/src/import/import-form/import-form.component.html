<app-dialog
  headerText="Import"
  [actionsTemplate]="actionsTemplate"
>
  <form [formGroup]="form">
    <app-upload-image
      [acceptFileTypes]="acceptedFileTypes"
      [multiple]="false"
      (fileLoaded)="fileLoaded($event)"
    ></app-upload-image>
    <app-select
      label="Import Type"
      optionValueKey="value"
      optionDisplayKey="displayValue"
      [inputFormControl]="form | formGet: 'importType'"
      [options]="importTypeOptions"
    ></app-select>
    @if (fileContents) {
      <div
        @fadeInOut
        class="d-flex flex-column"
      >
        <h3 class="text-dark">File Contents</h3>
        <div
          class="json-container"
          [innerHtml]="fileContents"
        ></div>
      </div>
    }
  </form>
  <app-dialog-footer
    submitButtonTooltip="Import"
    (submitClicked)="submit()"
    (cancelClicked)="closeDialog()"
  ></app-dialog-footer>
</app-dialog>

<ng-template #actionsTemplate>
  <div class="d-flex">
    <app-button
      class="me-2"
      matButtonType="iconButton"
      tooltip="Upload File"
      icon="upload"
      (clicked)="openFileUploadDialog()">
    </app-button>
    @if (fileContents) {
      <app-delete-button
        tooltip="Remove file"
        @fadeInOut
        (clicked)="clearFileContents()"
      ></app-delete-button>
    }
  </div>
</ng-template>
