<div class="d-flex">
  <!--
    A hinted field sizes its subscript dynamically. Material's default "fixed"
    reserves a single line and positions the hint wrapper absolutely, so a hint
    that wraps overflows and paints over whatever follows the field. Fields with
    no hint keep "fixed", so the error row stays reserved and they do not jump
    when a mat-error appears.
  -->
  <mat-form-field
    class="w-100"
    [appearance]="appearance()"
    [subscriptSizing]="hint ? 'dynamic' : 'fixed'"
  >
    <mat-label>{{ label }}</mat-label>
    <div class="d-flex align-items-center">
      <input
        #nativeInput
        matInput
        [id]="inputId()"
        [type]="type"
        [readonly]="readonly"
        [formControl]="inputFormControl"
        [prefix]="maskPrefix"
        [suffix]="maskSuffix"
        [mask]="mask"
        [decimalMarker]="decimalMarker"
        [thousandSeparator]="thousandSeparator"
        [allowNegativeNumbers]="true"
        (blur)="inputBlur.emit($event)"
      />
    </div>
    <mat-error *ngFor="let err of formControlErrors | async">{{
        err.message
      }}
    </mat-error>
    @if (showVisibilityEye || showGeneratePassword) {
      <div matSuffix>
        @if (showGeneratePassword) {
          <button
            class="generate-password-button"
            mat-icon-button
            type="button"
            data-testid="password-generate"
            aria-label="Generate password"
            matTooltip="Generate password"
            [disabled]="inputFormControl.disabled || readonly"
            (click)="generatePassword()"
          >
            <mat-icon>autorenew</mat-icon>
          </button>
        }
        @if (showVisibilityEye) {
          <button
            class="visibility-eye-button"
            mat-icon-button
            type="button"
            data-testid="password-visibility-toggle"
            [matTooltip]="type === 'password' ? 'Show ' + label : 'Hide ' + label"
            (click)="toggleVisibility()"
          >
            @if (type === 'password') {
              <mat-icon>visibility</mat-icon>
            } @else {
              <mat-icon>visibility_off</mat-icon>
            }
          </button>
        }
      </div>
    }
    @if (hint) {
      <mat-hint>
        {{ hint }}
      </mat-hint>
    }
  </mat-form-field>
</div>
