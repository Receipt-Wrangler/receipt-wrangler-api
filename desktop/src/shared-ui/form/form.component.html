<app-form-header
  [headerText]="formConfig().headerText"
  [headerButtonsTemplate]="headerButtonsTemplate"
  [bottomSpacing]="bottomSpacing()"
></app-form-header>
<form [formGroup]="form()" (ngSubmit)="submitted.emit()">
  <div class="w-100">
    <ng-template [ngTemplateOutlet]="formTemplate()"></ng-template>
  </div>
  <app-form-button-bar [mode]="formConfig().mode">
    @if (!(formConfig().mode | inputReadonly)) {
      <app-submit-button
        class="mb-3"
        [disabled]="submitButtonDisabled()"
        [onlyIcon]="false"
      ></app-submit-button>
    }
  </app-form-button-bar>
</form>

<ng-template #headerButtonsTemplate>
  @if ((formConfig().mode | inputReadonly) && canEdit()) {
    <app-edit-button
      color="accent"
      [buttonRouterLink]="editButtonRouterLink()"
      [buttonQueryParams]="editButtonQueryParams()"
    >
    </app-edit-button>
  }
</ng-template>
