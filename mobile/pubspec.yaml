name: receipt_wrangler_mobile
description: "A mobile client for Receipt Wrangler"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.3.0+25

environment:
  sdk: ">=3.7.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  openapi:
    path: api
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  intl: 0.20.2
  http: ^1.2.0
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.0.0
  go_router: ^17.3.0
  flutter_secure_storage: ^10.0.0-beta.5
  dart_jsonwebtoken: ^3.4.1
  shared_preferences: ^2.2.2
  infinite_scroll_pagination: ^5.1.1
  infinite_carousel: ^1.1.1
  photo_view: ^0.15.0
  flutter_native_splash: ^2.3.10
  permission_handler: ^12.0.1
  cunning_document_scanner: ^2.3.0
  mobile_scanner: ^7.2.0
  # Handles receiptwrangler.io/app/setup App Links / Universal Links ourselves
  # (rather than via go_router) so the desktop login QR / OS-opened deep link
  # can pre-fill the Connect-to-Server URL. See lib/main.dart's deep-link handler.
  app_links: ^6.4.1
  # Signs users in with an external identity provider through the system browser
  # (ASWebAuthenticationSession on iOS, a Chrome Auth Tab on Android) rather than
  # an embedded WebView, which RFC 8252 requires and Google actively rejects.
  #
  # Pinned to the 5.x line deliberately, the same check that keeps app_links on
  # 6.x: 5.1.0 needs Dart >=3.5.0 and Flutter >=3.24.0, both satisfied by this
  # app's >=3.7.0 floor, while 6.x requires Dart ^3.12.0 and is still alpha.
  # Raising it would mean raising the Dart floor -- do that deliberately.
  flutter_web_auth_2: ^5.1.0
  # Declared explicitly (not just transitively) because lib/utils/pkce.dart
  # imports it directly for the S256 code challenge.
  crypto: ^3.0.3
  file_selector: ^1.0.3
  rxdart: ^0.28.0
  flutter_launcher_icons: ^0.14.1
  currency_text_input_formatter: ^2.2.5
  flutter_slidable: ^4.0.3
  flutter_staggered_grid_view: ^0.7.0
  accordion: ^2.6.0
  uuid: ^4.4.2
  gal: ^2.3.0
  currency_textfield: ^5.0.0+1
  money2: ^6.0.3
  flutter_svg: ^2.0.16
  fl_chart: ^1.2.0
  webview_flutter: ^4.14.1
  path_provider: ^2.1.6
  share_plus: ^13.2.1
  sentry_flutter: ^8.14.2
  # Kept as a regular dependency (not a dev_dependency) on purpose.
  # Flutter 3.27+ strips dev_dependency plugins from release builds, but the
  # generated GeneratedPluginRegistrant.java still references IntegrationTestPlugin
  # whenever `flutter pub get` runs (e.g. Android Studio project sync). A release
  # build driven straight from Gradle -- the Android Studio "Generate Signed
  # Bundle / APK" wizard -- then fails to compile that stale reference.
  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/branding/loading.gif
    - assets/branding/logo-large.svg
    - assets/icons/split.svg
    - assets/test/sample.png
  fonts:
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Thin.ttf
          weight: 100
        - asset: fonts/Raleway-ExtraLight.ttf
          weight: 200
        - asset: fonts/Raleway-Light.ttf
          weight: 300
        - asset: fonts/Raleway-Regular.ttf
          weight: 400
        - asset: fonts/Raleway-Medium.ttf
          weight: 500
        - asset: fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: fonts/Raleway-Bold.ttf
          weight: 700
        - asset: fonts/Raleway-ExtraBold.ttf
          weight: 800
        - asset: fonts/Raleway-Black.ttf
          weight: 900
        - asset: fonts/Raleway-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: fonts/Raleway-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: fonts/Raleway-LightItalic.ttf
          style: italic
          weight: 300
        - asset: fonts/Raleway-Italic.ttf
          style: italic
          weight: 400
        - asset: fonts/Raleway-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: fonts/Raleway-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: fonts/Raleway-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: fonts/Raleway-ExtraBoldItalic.ttf
          style: italic
          weight: 800
        - asset: fonts/Raleway-BlackItalic.ttf
          style: italic
          weight: 900

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
